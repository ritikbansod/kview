###############################################################################
# 02-kafka-cluster.yaml (Strimzi 1.2.0 / Kafka 4.3.1 KRaft Mode)
# Production-ready KRaft Kafka Cluster with KafkaNodePool (KNP):
#  - 3 Dedicated Controllers (KafkaNodePool: 'controller')
#  - 3 Dedicated Brokers (KafkaNodePool: 'broker')
#
# Optimized for Docker Kubernetes (Kind, Minikube, Docker Desktop K8s):
#  - Sane CPU/Memory limits so all 6 pods run smoothly on local Docker engines
#
# Listeners:
#  - Port 9092: Internal PLAINTEXT (no auth, unencrypted)
#  - Port 9093: Internal mTLS (mutual TLS client authentication)
#  - Port 9094 / 443: External OAuth 2.0 (SASL_SSL / OAUTHBEARER token validation)
#  - Port 9095: External mTLS (mutual TLS client authentication exposed externally)
###############################################################################

# -----------------------------------------------------------------------------
# 1. Controller Node Pool (3 Replicas, KRaft Metadata Quorum)
# -----------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: kview-cluster
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false
        kraftMetadata: shared
  jvmOptions:
    "-Xms": "128m"
    "-Xmx": "384m"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

---
# -----------------------------------------------------------------------------
# 2. Broker Node Pool (3 Replicas, Data Storage & Message Handling)
# -----------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: kview-cluster
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
        kraftMetadata: shared
  jvmOptions:
    "-Xms": "256m"
    "-Xmx": "512m"
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi

---
# -----------------------------------------------------------------------------
# 3. Kafka Cluster Definition (Strimzi 1.2.0 / Kafka 4.3.1 KRaft)
# -----------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kview-cluster
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0

    # -------------------------------------------------------------------------
    # Security Listeners Specification
    # -------------------------------------------------------------------------
    listeners:
      # [1] Port 9092: Internal PLAINTEXT
      # Accessible inside cluster: kview-cluster-kafka-bootstrap.kafka.svc:9092
      - name: plain
        port: 9092
        type: internal
        tls: false

      # [2] Port 9093: Internal mTLS (Mutual TLS)
      # Encrypted + client certificate verified inside Kubernetes
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls

      # [3] Port 9094 / 443: External OAuth 2.0 (SASL_SSL / OAUTHBEARER)
      # Validates JWT tokens against Keycloak or any OIDC-compliant Identity Provider
      - name: oauth
        port: 9094
        type: nodeport
        tls: true
        authentication:
          type: custom
          sasl: true
          listenerConfig:
            sasl.enabled.mechanisms: OAUTHBEARER
            oauthbearer.sasl.server.callback.handler.class: io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
            oauthbearer.sasl.jaas.config: |
              org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
                oauth.check.issuer="false"
                oauth.jwks.endpoint.uri="http://keycloak.kafka.svc.cluster.local:8080/realms/kafka/protocol/openid-connect/certs"
                oauth.username.claim="preferred_username";
            connections.max.reauth.ms: 3600

      # [4] Port 9095: External mTLS
      # Exposes mTLS to clients outside Kubernetes via NodePort
      - name: extmtls
        port: 9095
        type: nodeport
        tls: true
        authentication:
          type: tls

    # -------------------------------------------------------------------------
    # Kafka Broker Configuration (KRaft 3-node HA defaults)
    # -------------------------------------------------------------------------
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Required for OAuth principal resolution
      principal.builder.class: io.strimzi.kafka.oauth.server.OAuthKafkaPrincipalBuilder

  # ---------------------------------------------------------------------------
  # Entity Operator (Topic Operator + User Operator for auto-managing client certs)
  # ---------------------------------------------------------------------------
  entityOperator:
    topicOperator: {}
    userOperator: {}
