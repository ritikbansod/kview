###############################################################################
# 03-sample-user-topic.yaml
# Sample resources for testing:
#  1. KafkaTopic: 'test-topic' (3 partitions, 3 replicas)
#  2. KafkaUser:  'test-mtls-user' (TLS client certificate generated automatically)
###############################################################################

# -----------------------------------------------------------------------------
# Sample Kafka Topic
# -----------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: test-topic
  namespace: kafka
  labels:
    strimzi.io/cluster: kview-cluster
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000       # 7 days
    segment.bytes: 1073741824     # 1 GiB

---
# -----------------------------------------------------------------------------
# Sample Kafka User for mTLS Authentication (Port 9093 and Port 9095)
# When applied, Strimzi's User Operator automatically issues:
#   - User Certificate: user.crt
#   - User Private Key: user.key
# Stored in Secret: 'test-mtls-user' in the 'kafka' namespace.
# -----------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: test-mtls-user
  namespace: kafka
  labels:
    strimzi.io/cluster: kview-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Allow produce and consume to all topics
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
        host: "*"
      # Allow consumer group coordination
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
        host: "*"
      # Allow cluster-level operations
      - resource:
          type: cluster
        operations:
          - Describe
        host: "*"
