name: Bug Report
description: Report an issue or bug in Kview
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help reproduce and diagnose the bug.
  - type: input
    id: version
    attributes:
      label: Kview Version
      placeholder: "e.g., 1.0.0, commit hash"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g., Java 21, Docker on Linux, Windows 11, Kafka 3.8 KRaft"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Data Explorer
        2. Browse topic 'orders'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Please paste any console errors or server logs.
      render: shell
