<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kview</title>
  <script>
    // apply theme before first paint (no flash)
    const saved = localStorage.getItem('kw.theme');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='16' r='4' fill='%23ff7a45'/%3E%3Ccircle cx='23' cy='7' r='4' fill='%23ffb26b'/%3E%3Ccircle cx='23' cy='25' r='4' fill='%23ffb26b'/%3E%3Cpath d='M10 14 L20 8 M10 18 L20 24' stroke='%23e6edf3' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand" title="Kview">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <circle cx="7" cy="16" r="4" fill="#ff7a45"/>
          <circle cx="23" cy="7" r="4" fill="#ffb26b"/>
          <circle cx="23" cy="25" r="4" fill="#ffb26b"/>
          <path d="M10 14 L20 8 M10 18 L20 24" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        <span class="brand-text">K<b>view</b></span>
      </div>
      <nav class="nav" id="nav">
        <a href="#/" data-route="/" class="nav-item" title="Dashboard (1)">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="#/topics" data-route="/topics" class="nav-item" title="Topics (2)">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zm0 6h16v4H4zm0 6h16v4H4z"/></svg>
          <span class="nav-text">Topics</span>
        </a>
        <a href="#/explorer" data-route="/explorer" class="nav-item" title="Data Explorer (3)">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span class="nav-text">Data Explorer</span>
        </a>
        <a href="#/groups" data-route="/groups" class="nav-item" title="Consumer Groups (4)">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span class="nav-text">Consumer Groups</span>
        </a>
        <a href="#/architecture" data-route="/architecture" class="nav-item" title="Cluster Architecture (5)">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm13 0v3h-3v2h5v-5zM14 17h2v-2h-2zm3 3h3v-2h-3z"/></svg>
          <span class="nav-text">Architecture</span>
        </a>
        <a href="#/connections" data-route="/connections" class="nav-item" title="Connections (6)">
          <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/></svg>
          <span class="nav-text">Connections</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="https://kafka.apache.org/documentation/" target="_blank" rel="noopener">Kafka docs ↗</a>
        <span>v1.0</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="cluster-picker">
          <label for="cluster-select">Cluster</label>
          <select id="cluster-select"></select>
          <span id="cluster-protocol" class="badge tone-neutral" title="Security protocol"></span>
        </div>
        <div class="topbar-actions">
          <button id="theme-btn" class="btn ghost sm" title="Toggle light / dark theme" aria-label="Toggle theme"></button>
          <button id="refresh-btn" class="btn ghost sm" title="Refresh view (data is re-fetched)">⟳ Refresh</button>
        </div>
      </header>
      <main id="view" class="view">
        <div class="empty-state">Loading…</div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
